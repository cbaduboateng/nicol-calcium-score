name: tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: node --test 'tests/*.test.js'
      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Extensions do not load in the headless shell, so the full Chromium
      # build is required here.
      - name: Install Chromium
        run: |
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: End-to-end test (scraped adapter)
        run: node tests/e2e/run.js
      - name: End-to-end test (Bluesky API adapter)
        run: node tests/e2e/bluesky.js
