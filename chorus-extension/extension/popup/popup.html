<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chorus</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 290px;
    margin: 0;
    padding: 14px 16px;
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #fff;
    color: #16181c;
  }
  h1 { font-size: 14px; margin: 0 0 2px; }
  .sub { color: #5b6169; font-size: 12px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 4px 0; }
  .stat span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; }
  .empty { color: #5b6169; padding: 6px 0 10px; }
  label.row {
    display: flex; align-items: center; gap: 8px;
    padding: 7px 0; border-top: 1px solid #eceef0; cursor: pointer;
  }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  button {
    flex: 1; padding: 7px 10px; border-radius: 8px;
    border: 1px solid #d7dbe0; background: #f6f7f9; color: inherit;
    font: 500 12px inherit; cursor: pointer;
  }
  button:hover { background: #eceef1; }
  .note { margin-top: 12px; font-size: 11px; color: #6b7280; line-height: 1.5; }
  @media (prefers-color-scheme: dark) {
    body { background: #16181c; color: #e7e9ea; }
    .sub, .empty, .note { color: #9aa0a6; }
    label.row { border-color: #2f3336; }
    button { background: #202327; border-color: #2f3336; }
  }
</style>
</head>
<body>
  <h1>Chorus</h1>
  <div class="sub" id="platform">Checking this page…</div>

  <div id="summary"></div>

  <label class="row">
    <input type="checkbox" id="enabled"> Analyse comment sections
  </label>
  <label class="row">
    <input type="checkbox" id="showWeak"> Show weak signals too
  </label>
  <label class="row">
    <input type="checkbox" id="memoryEnabled"> Remember wording across threads
  </label>

  <div class="actions">
    <button id="rescan" type="button">Re-scan</button>
    <button id="options" type="button">Settings</button>
  </div>

  <p class="note">
    Chorus reports repeated wording across accounts. It does not identify bots,
    and shared wording has innocent explanations. Always read the evidence
    before drawing a conclusion.
  </p>

  <script src="popup.js" type="module"></script>
</body>
</html>
