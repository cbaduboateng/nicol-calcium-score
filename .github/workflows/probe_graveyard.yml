name: Probe graveyard tickers

# One-off, manual: the dev sandbox cannot reach Yahoo, so the
# alive/rescued/dead verdicts for persistently unpriced tickers are
# gathered on a runner and committed for the pruning pass.

on:
  workflow_dispatch: {}
  push:
    branches: [congress-signal-extract]
    paths: [".graveyard-probe-request"]   # touch this file to trigger a probe

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: congress-signal-extract

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[prices]" pyarrow

      - name: Probe
        run: python scripts/probe_graveyard.py

      - name: Commit results
        run: |
          git config user.name "icarus-graveyard-probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/cache/graveyard_probe.json
          if git diff --cached --quiet; then
            echo "No probe changes to commit"
            exit 0
          fi
          git commit -m "Graveyard probe results"
          git pull --rebase origin congress-signal-extract
          git push origin congress-signal-extract
